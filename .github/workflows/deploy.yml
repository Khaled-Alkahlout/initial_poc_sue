
name: Build and Push AI Tool

on:
  push:
    branches:
      - aws-deployment
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GitHub OIDC identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          request = urllib.request.Request(
              url + "&audience=sts.amazonaws.com",
              headers={"Authorization": "Bearer " + token}
          )
          jwt = json.load(urllib.request.urlopen(request))["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("Audience:", claims.get("aud"))
          print("Subject:", claims.get("sub"))
          PY


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::710414398852:role/sue-github-actions-role
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t sue-ai-tool .

      - name: Tag and push to ECR
        run: |
          docker tag sue-ai-tool:latest 710414398852.dkr.ecr.eu-north-1.amazonaws.com/sue-ai-tool:latest
          docker push 710414398852.dkr.ecr.eu-north-1.amazonaws.com/sue-ai-tool:latest


      - name: Register new ECS task definition
        shell: bash
        run: |
          IMAGE="710414398852.dkr.ecr.eu-north-1.amazonaws.com/sue-ai-tool:latest"

          aws ecs describe-task-definition \
            --task-definition sue-ai-tool \
            --query taskDefinition \
            --output json > current-task.json

          jq --arg IMAGE "$IMAGE" '
            {
              family,
              executionRoleArn,
              networkMode,
              containerDefinitions,
              requiresCompatibilities,
              cpu,
              memory
            }
            | .containerDefinitions |= map(
                if .name == "sue-ai-tool"
                then .image = $IMAGE
                else .
                end
              )
          ' current-task.json > new-task.json

          aws ecs register-task-definition \
            --cli-input-json file://new-task.json
